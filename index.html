<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی 2048</title>
    <style>
        @import url('https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css');

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #faf8ef;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        h1 {
            margin-bottom: 20px;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            background-color: #bbada0;
            padding: 10px;
            border-radius: 10px;
            width: 90vw;
            max-width: 400px;
        }

        .tile {
            width: 100%;
            padding-top: 100%;
            position: relative;
            background-color: #cdc1b4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: #776e65;
            border-radius: 5px;
            transition: all 0.2s ease-in-out;
        }

        .tile div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile[data-value="2"] {
            background-color: #eee4da;
        }

        .tile[data-value="4"] {
            background-color: #ede0c8;
        }

        .tile[data-value="8"] {
            background-color: #f2b179;
            color: #f9f6f2;
        }

        .tile[data-value="16"] {
            background-color: #f59563;
            color: #f9f6f2;
        }

        .tile[data-value="32"] {
            background-color: #f67c5f;
            color: #f9f6f2;
        }

        .tile[data-value="64"] {
            background-color: #f65e3b;
            color: #f9f6f2;
        }

        .tile[data-value="128"] {
            background-color: #edcf72;
            color: #f9f6f2;
        }

        .tile[data-value="256"] {
            background-color: #edcc61;
            color: #f9f6f2;
        }

        .tile[data-value="512"] {
            background-color: #edc850;
            color: #f9f6f2;
        }

        .tile[data-value="1024"] {
            background-color: #edc53f;
            color: #f9f6f2;
        }

        .tile[data-value="2048"] {
            background-color: #edc22e;
            color: #f9f6f2;
        }

    </style>
</head>

<body>
    <h1>بازی 2048</h1>
    <div id="game-board"></div>
    <script src="https://hammerjs.github.io/dist/hammer.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
        var gameBoard = document.getElementById('game-board');
        var tiles = [];

        function initializeBoard() {
            for (var i = 0; i < 16; i++) {
                var tile = document.createElement('div');
                var innerTile = document.createElement('div');
                tile.classList.add('tile');
                tile.appendChild(innerTile);
                gameBoard.appendChild(tile);
                tiles.push(tile);
            }
            addNewTile();
            addNewTile();
            updateBoard();
        }

        function addNewTile() {
            var emptyTiles = tiles.filter(function(tile) { return !tile.dataset.value; });
            if (emptyTiles.length === 0) return;
            var randomTile = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
            randomTile.dataset.value = Math.random() < 0.9 ? 2 : 4;
        }

        function updateBoard() {
            tiles.forEach(function(tile) {
                var innerTile = tile.firstChild;
                innerTile.textContent = tile.dataset.value ? tile.dataset.value : '';
                tile.className = 'tile';
                if (tile.dataset.value) {
                    tile.classList.add('tile');
                    tile.classList.add('tile-' + tile.dataset.value);
                }
            });
        }

        function slideTiles(row) {
            var arr = row.filter(function(tile) { return tile.dataset.value; }).map(function(tile) { return parseInt(tile.dataset.value); });
            var missing = 4 - arr.length;
            var zeros = Array(missing).fill(0);
            arr = zeros.concat(arr);
            for (var i = 0; i < 4; i++) {
                row[i].dataset.value = arr[i] ? arr[i] : '';
            }
        }

        function combineTiles(row) {
            for (var i = 3; i > 0; i--) {
                if (row[i].dataset.value && row[i].dataset.value === row[i - 1].dataset.value) {
                    row[i].dataset.value = parseInt(row[i].dataset.value) * 2;
                    row[i - 1].dataset.value = '';
                    slideTiles(row);
                }
            }
        }

        function moveRight() {
            for (var i = 0; i < 16; i += 4) {
                var row = [tiles[i], tiles[i + 1], tiles[i + 2], tiles[i + 3]];
                slideTiles(row);
                combineTiles(row);
                slideTiles(row);
            }
        }

        function moveLeft() {
            for (var i = 0; i < 16; i += 4) {
                var row = [tiles[i + 3], tiles[i + 2], tiles[i + 1], tiles[i]];
                slideTiles(row);
                combineTiles(row);
                slideTiles(row);
                row.reverse();
            }
        }

        function moveUp() {
            for (var i = 0; i < 4; i++) {
                var column = [tiles[i + 12], tiles[i + 8], tiles[i + 4], tiles[i]];
                slideTiles(column);
                combineTiles(column);
                slideTiles(column);
                column.reverse();
            }
        }

        function moveDown() {
            for (var i = 0; i < 4; i++) {
                var column = [tiles[i], tiles[i + 4], tiles[i + 8], tiles[i + 12]];
                slideTiles(column);
                combineTiles(column);
                slideTiles(column);
            }
        }

        function control(e) {
            switch(e.key) {
                case 'ArrowRight':
                    moveRight();
                    break;
                case 'ArrowLeft':
                    moveLeft();
                    break;
                case 'ArrowUp':
                    moveUp();
                    break;
                case 'ArrowDown':
                    moveDown();
                    break;
                default:
                    return;
            }
            addNewTile();
            updateBoard();
        }

        function handleSwipe(direction) {
            switch(direction) {
                case 'swipeleft':
                    moveLeft();
                    break;
                case 'swiperight':
                    moveRight();
                    break;
                case 'swipeup':
                    moveUp();
                    break;
                case 'swipedown':
                    moveDown();
                    break;
                default:
                    return;
            }
            addNewTile();
            updateBoard();
        }

        var hammer = new Hammer(document.body);
        hammer.get('swipe').set({ direction: Hammer.DIRECTION_ALL });
        hammer.on('swipeleft swiperight swipeup swipedown', function(e) { handleSwipe(e.type); });

        document.addEventListener('keyup', control);
        initializeBoard();
    });
    </script>
</body>

</html>
